<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102820"><title>Новогодний проигрыватель — Зимняя сказка</title><link rel="stylesheet" href="qr-assets/style.css"><main><div class="eyebrow">Зимняя сказка · звуки праздника</div><h1>Музыка<br>для тёплых встреч</h1><p>Пять новогодних мелодий. Выберите ту, что подходит вашему настроению.</p><section class="card"><p id="now"></p><p id="artist"></p><label for="seek" class="hint">Позиция воспроизведения</label><input id="seek" type="range" min="0" max="1000" value="0" disabled><div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div><div class="controls"><button id="prev" aria-label="Предыдущий трек">❮</button><button id="toggle">Включить</button><button id="next" aria-label="Следующий трек">❯</button></div><div id="status" role="status" aria-live="polite"></div></section><section id="tracks" aria-label="Подборка музыки"></section><p class="hint">После окончания песни заиграет следующая. Громкость регулируется кнопками телефона.</p><audio preload="none"></audio><footer><a href="fireplace.html">Послушать камин →</a></footer></main><script>const audio=document.querySelector('audio'),toggle=document.querySelector('#toggle'),status=document.querySelector('#status');let intent=0;function sync(){toggle.textContent=audio.paused?'Включить':'Пауза';document.body.classList.toggle('playing',!audio.paused)}audio.addEventListener('play',sync);audio.addEventListener('pause',sync);audio.addEventListener('error',()=>{status.textContent='Не удалось загрузить звук. Проверьте интернет и попробуйте ещё раз.';sync()});async function play(){const id=++intent;status.textContent='Загрузка…';try{await audio.play();if(id===intent)status.textContent='';}catch(e){if(id===intent&&e.name!=='AbortError')status.textContent='Нажмите «Включить» ещё раз. Проверьте интернет и громкость.'}sync()}toggle.onclick=()=>{if(audio.paused)play();else{intent++;audio.pause();status.textContent=''}};
const tracks=[{"src": "qr-assets/alan-jackson.mp3", "title": "A Holly Jolly Christmas", "artist": "Alan Jackson", "duration": 134}, {"src": "qr-assets/billy-mack.mp3", "title": "Christmas Is All Around", "artist": "Billy Mack", "duration": 229}, {"src": "qr-assets/dean-martin.mp3", "title": "Let It Snow", "artist": "Dean Martin", "duration": 115}, {"src": "qr-assets/larisa-dolina.mp3", "title": "Тройка · «Чародеи»", "artist": "Лариса Долина", "duration": 141}, {"src": "qr-assets/nat-king-cole.mp3", "title": "The Christmas Song", "artist": "Nat King Cole", "duration": 196}];let selected=0;const list=document.querySelector('#tracks'),seek=document.querySelector('#seek');const time=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');function choose(i,start=true){intent++;audio.pause();selected=(i+tracks.length)%tracks.length;const t=tracks[selected];audio.src=t.src;document.querySelector('#now').textContent=t.title;document.querySelector('#artist').textContent=t.artist;document.querySelector('#total').textContent=time(t.duration);document.querySelector('#elapsed').textContent='0:00';seek.value=0;seek.disabled=true;status.textContent='';list.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===selected));if(start)play();}tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='track';b.innerHTML='<span class="num">0'+(i+1)+'</span><span>'+t.title+'<small>'+t.artist+'</small></span><span class="duration">'+time(t.duration)+'</span>';b.onclick=()=>choose(i);list.appendChild(b)});document.querySelector('#prev').onclick=()=>choose(selected-1);document.querySelector('#next').onclick=()=>choose(selected+1);audio.addEventListener('ended',()=>choose(selected+1));audio.addEventListener('loadedmetadata',()=>{seek.disabled=!Number.isFinite(audio.duration);document.querySelector('#total').textContent=time(audio.duration||0)});audio.addEventListener('timeupdate',()=>{seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;document.querySelector('#elapsed').textContent=time(audio.currentTime)});seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration};choose(0,false);</script></html>
