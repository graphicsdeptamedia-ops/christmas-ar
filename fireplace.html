<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102820"><title>Звуки камина — Зимняя сказка</title><link rel="stylesheet" href="qr-assets/style.css"><main><div class="eyebrow">Зимняя сказка · звуки праздника</div><h1>Тепло<br>зимнего вечера</h1><p>Устройтесь поудобнее и послушайте, как потрескивают дрова.</p><section class="card"><div class="symbol" id="flame" aria-hidden="true">♨</div><button class="wide" id="toggle">Зажечь камин</button><p id="status" role="status" aria-live="polite"></p><p class="hint">Звук повторяется по кругу. Громкость регулируется кнопками телефона.</p></section><audio src="qr-assets/fire.mp3" preload="none" loop></audio><footer><a href="playlist.html">Выбрать новогоднюю музыку →</a></footer></main><script>const audio=document.querySelector('audio'),toggle=document.querySelector('#toggle'),status=document.querySelector('#status');let intent=0;function sync(){toggle.textContent=audio.paused?'Включить':'Пауза';document.body.classList.toggle('playing',!audio.paused)}audio.addEventListener('play',sync);audio.addEventListener('pause',sync);audio.addEventListener('error',()=>{status.textContent='Не удалось загрузить звук. Проверьте интернет и попробуйте ещё раз.';sync()});async function play(){const id=++intent;status.textContent='Загрузка…';try{await audio.play();if(id===intent)status.textContent='';}catch(e){if(id===intent&&e.name!=='AbortError')status.textContent='Нажмите «Включить» ещё раз. Проверьте интернет и громкость.'}sync()}toggle.onclick=()=>{if(audio.paused)play();else{intent++;audio.pause();status.textContent=''}};</script></html>
